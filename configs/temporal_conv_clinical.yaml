# Temporal Conv with clinical loss (threshold-aware)
# Usage: python main.py configs/temporal_conv_clinical.yaml

# === DATA ===
video_folder: "/research/projects/Sahika/projects/liver_PDFF/data/EUS_videos_v5_feb26"
csv_path: "/research/projects/Sahika/projects/liver_PDFF/data/dataset_v5_5fold_feb26_trainval_only.csv"
cache_dir: "/research/projects/Sahika/projects/liver_PDFF/data/frame_cache_384"
img_size: 384
n_frames: 175

# === MODEL ===
backbone: "swin_tiny_patch4_window7_224.ms_in1k"
aggregator: "temporal_conv32h4"

# === CLASSIFICATION ===
use_classifier: true
cls_weight: 0.5  # Equal weight
num_classes: 4

# === LOSS ===
loss_preset: "clinical"  # Threshold-aware loss

# === TRAINING ===
epochs: 100
grad_accum: 8
lr: 0.0001
seed: 42

# === CV ===
n_folds: 5
fold_set_prefix: "set"

# === OUTPUT ===
output_dir: "/research/projects/Sahika/projects/liver_PDFF/runs"
